---
# Shared infrastructure for optional RHEL CPU VM demos. The launcher never
# deletes this namespace. Customer-specific VM resources live inside it.
apiVersion: v1
kind: Namespace
metadata:
  name: edu-ai-demo-rhel-vms
  labels:
    app.kubernetes.io/part-of: edu-ai-demo
    edu-ai-demo/purpose: rhel-vms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: edu-ai-demo-rhel-vms
  name: edu-ai-demo-rhel-vm-manager
rules:
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachineinstances]
    verbs: [get, list]
  # CDI and KubeVirt create the disk from the VM's dataVolumeTemplate.
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [image.openshift.io]
    resources: [imagestreams]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: edu-ai-demo-rhel-vms
  name: edu-ai-demo-rhel-vm-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: edu-ai-demo-rhel-vm-manager
subjects:
  - kind: ServiceAccount
    name: edu-ai-demo-runner
    namespace: aap
