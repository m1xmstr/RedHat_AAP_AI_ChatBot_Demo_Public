---
- name: Locate the template in this project
  no_log: true
  ansible.builtin.uri:
    url: "{{ aap_api_base }}/job_templates/?name={{ edu_template.name | urlencode }}&organization={{ aap_org_id }}"
  register: edu_template_lookup

- name: Reject ambiguous template names or a template belonging to another project
  ansible.builtin.assert:
    that:
      - edu_template_lookup.json.count <= 1
      - edu_template_lookup.json.count == 0 or edu_template_lookup.json.results[0].project | int == aap_project_id | int

- name: Configure job template
  no_log: true
  ansible.builtin.uri:
    url: "{{ aap_api_base }}/job_templates/{{ (edu_template_lookup.json.results[0].id ~ '/') if edu_template_lookup.json.count else '' }}"
    method: "{{ 'PATCH' if edu_template_lookup.json.count else 'POST' }}"
    status_code: [200, 201]
    body: >-
      {{ {'name': edu_template.name, 'job_type': 'run', 'inventory': aap_inventory_id | int,
          'project': aap_project_id | int, 'playbook': 'playbooks/' ~ edu_template.playbook ~ '.yml',
          'allow_simultaneous': false, 'ask_variables_on_launch': false, 'survey_enabled': true}
         | combine({'execution_environment': aap_ee_lookup.json.results[0].id | int}
                   if aap_execution_environment_name | default('') else {}) }}
  register: edu_template_object

- name: Install the template survey
  block:
    - name: Upload launch form
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/job_templates/{{ edu_template_object.json.id }}/survey_spec/"
        method: POST
        body: "{{ edu_template.survey }}"
        status_code: [200, 201, 204]
      no_log: true
  rescue:
    - name: Show survey validation details
      ansible.builtin.fail:
        msg: "AAP refused the {{ edu_template.name }} survey ({{ ansible_failed_result.status | default('unknown') }}): {{ ansible_failed_result.json | default({}) }}"

- name: Record configured template ID
  ansible.builtin.set_fact:
    edu_templates: "{{ edu_templates | default({}) | combine({edu_template.playbook: edu_template_object.json.id}) }}"
