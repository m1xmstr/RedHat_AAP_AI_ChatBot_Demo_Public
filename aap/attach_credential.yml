---
- name: Inspect credentials attached to this template
  ansible.builtin.uri:
    url: "{{ aap_api_base }}/job_templates/{{ edu_template_cred.0 }}/credentials/?page_size=200"
  register: edu_attached
  no_log: true

- name: Reject a conflicting credential of the same type
  ansible.builtin.assert:
    that:
      - edu_attached.json.results | selectattr('credential_type', 'equalto', edu_template_cred.1.credential_type | int) | rejectattr('id', 'equalto', edu_template_cred.1.id | int) | list | length == 0
    fail_msg: "Template {{ edu_template_cred.0 }} already uses a different credential of this type. Check its credentials before changing the deployment target."

- name: Attach credential
  ansible.builtin.uri:
    url: "{{ aap_api_base }}/job_templates/{{ edu_template_cred.0 }}/credentials/"
    method: POST
    body: "{{ {'id': edu_template_cred.1.id | int} }}"
    status_code: [200, 201, 204]
  no_log: true
  when: edu_template_cred.1.id | int not in (edu_attached.json.results | map(attribute='id') | list)
