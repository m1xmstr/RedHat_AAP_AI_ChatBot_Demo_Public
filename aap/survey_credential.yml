---
- name: Locate the dedicated survey account and its controller credential
  ansible.builtin.uri:
    url: "{{ item }}"
  loop:
    - "{{ aap_gateway_base }}/users/?username={{ aap_survey_username | urlencode }}"
    - "{{ aap_api_base }}/credentials/?name={{ aap_survey_credential_name | urlencode }}&organization={{ aap_org_id }}"
    - "{{ aap_api_base }}/credential_types/?namespace=controller"
  register: edu_survey_lookups
  no_log: true

- name: Validate account ownership and existing credential
  ansible.builtin.assert:
    that:
      - edu_user.count <= 1 and edu_cred.count <= 1 and edu_type.count == 1
      - not edu_user.count or (edu_user.results[0].first_name == aap_survey_identity_marker and not edu_user.results[0].is_superuser and not edu_user.results[0].is_platform_auditor)
      - not edu_cred.count or (edu_user.count and edu_cred.results[0].credential_type == edu_type.results[0].id and edu_cred.results[0].inputs.username == aap_survey_username and edu_cred.results[0].inputs.host == aap_controller_url)
    fail_msg: "The survey account or credential conflicts with an existing identity. Supply unique aap_survey_username and aap_survey_credential_name."
  vars:
    edu_user: "{{ edu_survey_lookups.results[0].json }}"
    edu_cred: "{{ edu_survey_lookups.results[1].json }}"
    edu_type: "{{ edu_survey_lookups.results[2].json }}"

- name: Create the limited survey identity when no encrypted credential exists
  when: not edu_survey_lookups.results[1].json.count
  block:
    - name: Generate a password for the survey identity in memory
      ansible.builtin.set_fact:
        edu_survey_password: "{{ lookup('password', '/dev/null length=56 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Create the gateway user or recover an interrupted bootstrap
      ansible.builtin.uri:
        url: "{{ aap_gateway_base }}/users/{{ (edu_survey_lookups.results[0].json.results[0].id ~ '/') if edu_survey_lookups.results[0].json.count else '' }}"
        method: "{{ 'PATCH' if edu_survey_lookups.results[0].json.count else 'POST' }}"
        body:
          username: "{{ aap_survey_username }}"
          first_name: "{{ aap_survey_identity_marker }}"
          password: "{{ edu_survey_password }}"
          is_superuser: false
          is_platform_auditor: false
        status_code: [200, 201]
      no_log: true

    - name: Establish the survey user's controller identity through the gateway
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/me/"
        url_username: "{{ aap_survey_username }}"
        url_password: "{{ edu_survey_password }}"
      register: edu_robot_me
      until: edu_robot_me.status == 200
      retries: 10
      delay: 2
      no_log: true

    - name: Store the generated password in an AAP controller credential
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/credentials/"
        method: POST
        body: >-
          {{ {'name': aap_survey_credential_name, 'organization': aap_org_id | int,
              'description': 'Managed by the EDU AI demo AAP setup to refresh the cleanup dropdown.',
              'credential_type': edu_survey_lookups.results[2].json.results[0].id | int,
              'inputs': {'host': aap_controller_url, 'username': aap_survey_username,
                         'password': edu_survey_password, 'verify_ssl': true}} }}
        status_code: 201
      register: edu_survey_cred_create
      no_log: true

- name: Record survey credential reference
  ansible.builtin.set_fact:
    edu_survey_cred_ref:
      id: "{{ edu_survey_lookups.results[1].json.results[0].id if edu_survey_lookups.results[1].json.count else edu_survey_cred_create.json.id }}"
      credential_type: "{{ edu_survey_lookups.results[2].json.results[0].id }}"
  no_log: true

- name: Locate survey identity and cleanup template administrator role
  no_log: true
  ansible.builtin.uri:
    url: "{{ item }}"
  loop:
    - "{{ aap_api_base }}/users/?username={{ aap_survey_username | urlencode }}"
    - "{{ aap_api_base }}/role_definitions/?name=JobTemplate%20Admin"
  register: edu_role_lookups

- name: Require a unique survey account and job template role
  ansible.builtin.assert:
    that: edu_role_lookups.results | map(attribute='json.count') | unique | list == [1]

- name: Locate existing assignment on the cleanup template
  no_log: true
  ansible.builtin.uri:
    url: "{{ aap_api_base }}/role_user_assignments/?user={{ edu_role_lookups.results[0].json.results[0].id }}&role_definition={{ edu_role_lookups.results[1].json.results[0].id }}&object_id={{ edu_templates.EDU_AI_DEMO_CLEANUP }}"
  register: edu_role_assignment

- name: Grant the survey account administration of this cleanup template only
  no_log: true
  ansible.builtin.uri:
    url: "{{ aap_api_base }}/role_user_assignments/"
    method: POST
    body: >-
      {{ {'user': edu_role_lookups.results[0].json.results[0].id | int,
          'role_definition': edu_role_lookups.results[1].json.results[0].id | int,
          'object_id': edu_templates.EDU_AI_DEMO_CLEANUP | int} }}
    status_code: [200, 201]
  when: not edu_role_assignment.json.count
